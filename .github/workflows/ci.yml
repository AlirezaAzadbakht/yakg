name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The GTK bindings are intentionally not installed here. The backend and
      # its tests must stay importable without a desktop stack, which this job
      # enforces by never providing one.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            dh-python \
            pybuild-plugin-pyproject \
            python3-all \
            python3-setuptools

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Smoke-test the package
        run: |
          set -eu
          cp ../yakg_*_all.deb .
          sudo apt-get install -y ./yakg_*_all.deb
          yakg --version
          test -f /usr/share/applications/io.github.yakg.Yakg.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.yakg.Yakg.svg
          test -x /usr/libexec/yakg-helper
          test -f /usr/share/polkit-1/actions/io.github.yakg.Yakg.policy
