name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dh-python \
            dpkg-dev \
            pybuild-plugin-pyproject \
            python3-all \
            python3-setuptools

      - name: Check versions match the tag
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          py_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          deb_version=$(dpkg-parsechangelog -S Version)
          deb_upstream="${deb_version%-*}"
          echo "tag=$tag pyproject=$py_version changelog=$deb_version"
          test "$tag" = "$py_version"
          test "$tag" = "$deb_upstream"

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          set -eu
          cp ../yakg_*_all.deb .
          sha256sum yakg_*_all.deb > SHA256SUMS

      - name: Smoke-test the package
        run: |
          set -eu
          sudo apt-get install -y ./yakg_*_all.deb
          yakg --version
          test -f /usr/share/applications/io.github.yakg.Yakg.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.yakg.Yakg.svg
          test -x /usr/libexec/yakg-helper
          test -f /usr/share/polkit-1/actions/io.github.yakg.Yakg.policy

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "YAKG ${GITHUB_REF_NAME#v}" \
            yakg_*_all.deb \
            SHA256SUMS

  apt-repo:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Add the new .deb to the signed apt repo on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y apt-utils
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo 2>/dev/null \
            || { git init -b gh-pages repo; git -C repo remote add origin \
                 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
          cd repo
          mkdir -p pool dists/stable/main/binary-all
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*_all.deb' --dir pool --clobber

          apt-ftparchive packages pool > dists/stable/main/binary-all/Packages
          gzip -kf9 dists/stable/main/binary-all/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=yakg \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=all \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

          echo "$GPG_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpg --export > yakg.gpg
          touch .nojekyll

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "apt repo: $GITHUB_REF_NAME"
          git push origin gh-pages
