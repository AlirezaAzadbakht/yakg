[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yakg"
version = "0.1.0"
description = "Yet Another Kerio GUI - an unofficial Linux desktop frontend for the Kerio Control VPN Client"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Alireza Azadbakht" }]
keywords = ["kerio", "vpn", "gtk", "gnome", "ubuntu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

# YAKG deliberately has no Python runtime dependencies from PyPI.
#
# The GTK 4 / libadwaita bindings are consumed through PyGObject, which is
# installed from the distribution as python3-gi rather than as a wheel: the
# PyPI build needs a full GObject/Cairo toolchain and would still have to match
# the system GTK. See README.md for the apt install line.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
yakg = "yakg.main:main"
yakg-helper = "yakg.helper:main"

[project.urls]
Homepage = "https://github.com/alirezaazadbakht/yakg"
Source = "https://github.com/alirezaazadbakht/yakg"
Issues = "https://github.com/alirezaazadbakht/yakg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yakg.resources" = ["icons/hicolor/scalable/apps/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "S",    # bandit
    "RUF",
]
ignore = [
    "S603",  # subprocess call - every call site here is an argv list by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assert, and fixture passwords, are the point

# PyGObject requires gi.require_version() to run before gi.repository is
# imported, so imports in these modules genuinely cannot all sit at the top.
"src/yakg/app.py" = ["E402"]
"src/yakg/ui/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# PyGObject ships no type stubs in the distribution packages.
[[tool.mypy.overrides]]
module = ["gi.*"]
ignore_missing_imports = true

# GTK widget subclasses derive from untyped gi classes, which strict mode would
# otherwise reject outright.
[[tool.mypy.overrides]]
module = ["yakg.app", "yakg.ui.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
